apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: frontend-ui
  name: frontend-ui
  namespace: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend-ui
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: frontend-ui
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: for
                    operator: In
                    values:
                      - ui
      containers:
        - name: frontend-ui
          image: frontend:istio
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-ui-svc
  namespace: frontend
spec:
  type: ClusterIP
  ports:
    - name: "frontend-ui-http"
      port: 80 # Port exposed by the service within the cluster
      targetPort: 80 # Port on which the frontend UI container listens
  selector:
    app: frontend-ui
