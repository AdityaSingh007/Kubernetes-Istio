---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-route-prometheus-dashboard
  namespace: app-infrastructure
spec:
  parentRefs:
    - name: istio-demo-gateway
      namespace: app-infrastructure
  hostnames:
    [
      "localhost",
      "istio-demo-gateway-istio.app-infrastructure.svc.cluster.local",
    ]
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /query
      backendRefs:
        - name: prometheus
          kind: Service
          namespace: istio-system
          port: 9090
    - matches:
        - path:
            type: PathPrefix
            value: /assets
      backendRefs:
        - name: prometheus
          kind: Service
          namespace: istio-system
          port: 9090
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1
      backendRefs:
        - name: prometheus
          kind: Service
          namespace: istio-system
          port: 9090
