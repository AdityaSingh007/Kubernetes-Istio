apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-route-gatewayapi
  namespace: app-infrastructure
spec:
  parentRefs:
    - name: istio-demo-gateway
      namespace: app-infrastructure
  hostnames:
    [
      "localhost",
      "istio-demo-gateway-istio.app-infrastructure.svc.cluster.local",
    ]
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /hc-ui
        - path:
            type: PathPrefix
            value: /ui
        - path:
            type: PathPrefix
            value: /healthchecks-api
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: gatewayapi-svc
          kind: Service
          namespace: backend
          port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-route-frontend-ui
  namespace: app-infrastructure
spec:
  parentRefs:
    - name: istio-demo-gateway
      namespace: app-infrastructure
  hostnames:
    [
      "localhost",
      "istio-demo-gateway-istio.app-infrastructure.svc.cluster.local",
    ]
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /frontend-ui
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: frontend-ui-svc
          kind: Service
          namespace: frontend
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-route-frontend-default
  namespace: app-infrastructure
spec:
  parentRefs:
    - name: istio-demo-gateway
      namespace: app-infrastructure
  hostnames:
    [
      "localhost",
      "istio-demo-gateway-istio.app-infrastructure.svc.cluster.local",
    ]
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: frontend-ui-svc
          kind: Service
          namespace: frontend
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
